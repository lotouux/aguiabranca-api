spring.application.name=api
server.port=${PORT:8080}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}

# JWT - sem fallback: uma variavel de ambiente ausente falha o boot em vez de assinar tokens
# com uma chave versionada no repositorio.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=aguiabranca-api

# CORS - nunca "*"; lista de origens vazia por padrao (ver application-dev.properties).
app.cors.origens=

# Nenhum AuthenticationManager/UserDetailsService e usado (a autenticacao e via JWT), mas o
# autoconfigure ainda tentaria criar um usuario em memoria e logar uma senha gerada sem isto.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

ai.api-key=${GROQ_API_KEY}